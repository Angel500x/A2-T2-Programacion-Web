<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Utilería</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="preload" as="image" href="img/1403198.png">
    <script src="js/utileria.js" defer></script>
    <script src="js/login.js" defer></script>
</head>
<body>

    <form id="loginForm">
        <h2>INICIO DE SESION</h2>

        <label for="correoLogin">Correo Electrónico</label>
        <input type="email" id="correoLogin" placeholder="correo@ejemplo.com">
        <p class="error-msg" id="err-correoLogin">Correo no válido o vacío.</p>

        <label for="passLogin">Contraseña</label>
        <input type="password" id="passLogin" placeholder="••••••••">
        <p class="error-msg" id="err-passLogin">Por favor, ingresa tu contraseña.</p>

        <button type="submit">Ingresar</button>
        <a href="index.html">Registrarse</a>
    </form>

    <div class="modal-overlay" id="modalLogin">
        <div class="modal-content">
            <h3>¡ACCESO CORRECTO!</h3>
            <button id="btnCerrarLogin">Continuar</button>
        </div>
    </div>

</body>
</html>
